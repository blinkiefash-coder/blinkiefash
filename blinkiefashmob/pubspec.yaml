name: blinkiefashmob
description: "BlinkieFash - Fashion shopping app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.9
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^19.5.0
  flutter_map: ^7.0.2
  geocoding: ^3.0.0
  geolocator: ^12.0.0
  google_fonts: ^8.1.0
  google_sign_in: ^6.3.0
  http: ^1.6.0
  image_picker: ^1.2.3
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  remove_alpha_ios: true
