name: blinkiefashmob
description: "BlinkieFash Mobile App - Flutter mobile application."
publish_to: 'none'

version: 2.0.1+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  cached_network_image: ^3.4.1
  firebase_auth: ^4.0.0
  firebase_core: ^2.0.0
  firebase_messaging: ^14.0.0
  flutter_local_notifications: ^16.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geocoding: ^2.0.4
  geolocator: ^9.0.2
  image_picker: ^1.0.0
  google_fonts: ^6.0.0
  google_sign_in: 6.2.2
  shared_preferences: ^2.0.0
  url_launcher: ^6.0.0
  share_plus: ^13.3.0
  http: ^1.6.0
  firebase_app_check: ^0.2.2
  flutter_contacts: ^2.3.1
  google_maps_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  google_sign_in_ios: 5.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
