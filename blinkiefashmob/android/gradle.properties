android.newDsl=false
android.useAndroidX=true
android.enableJetifier=true
android.experimental.enableNewResourceShrinker=true
android.experimental.enableNewResourceShrinker.validatedR8=true
# AGP 8.12+ optimized resource shrinking (integrates resources into the R8 code graph).
# Becomes automatic once AGP 9.0+ is adopted (requires a newer Flutter engine, see notes).
android.r8.optimizedResourceShrinking=true
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g --enable-native-access=ALL-UNNAMED
org.gradle.warning.mode=none
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.java.home=/Users/sa40091223/.jdks/android-studio-jbr
android.builtInKotlin=false

systemProp.http.keepAlive=true
systemProp.http.maxConnections=10
org.gradle.internal.http.socketTimeout=180000
org.gradle.internal.http.connectionTimeout=180000
