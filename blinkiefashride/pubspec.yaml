name: blinkiefashride
description: "BlinkieFash Rider App - Flutter application for delivery riders."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  firebase_auth: ^4.0.0
  firebase_core: ^2.0.0
  firebase_messaging: ^14.0.0
  flutter_local_notifications: ^17.0.0
  flutter_map: ^7.0.0
  flutter_ringtone_player: ^4.0.0
  geolocator: ^9.0.0
  google_fonts: ^6.0.0
  google_sign_in: ^6.0.0
  image_picker: ^1.0.0
  shared_preferences: ^2.0.0
  url_launcher: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
