<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="icon" href="/favicon-192x192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />

    <!-- Critical CSS: Prevent FOUC by ensuring vendor page loads with proper styles -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #fff; color: #0f172a; }
      .vendor-page { display: grid; grid-template-columns: 1fr; min-height: 100vh; background: linear-gradient(135deg, #f0fdf4 0%, #f9fafb 100%); }
      .vendor-hero-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; padding: 40px; max-width: 1400px; margin: 0 auto; }
      .vendor-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(15, 23, 42, 0.15); max-width: 440px; }
      .vendor-card h2 { font-size: 26px; font-weight: 800; margin-bottom: 10px; color: #0f172a; }
      .vendor-card form { display: flex; flex-direction: column; gap: 20px; }
      .vendor-card input { padding: 14px 16px; border-radius: 10px; border: 1.5px solid #e5e7eb; outline: none; font-size: 14px; background: #f9fafb; width: 100%; box-sizing: border-box; }
      .vendor-card button[type="submit"] { margin-top: 8px; padding: 14px 16px; border: none; border-radius: 10px; background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: white; font-weight: 700; font-size: 15px; cursor: pointer; }
      @media (max-width: 1024px) { .vendor-hero-panel { grid-template-columns: 1fr; } .vendor-card { max-width: 100%; } }
    </style>

    <!-- Primary SEO -->
    <title>Blinkiefash — 60-Minute Fashion Delivery in Odisha</title>
    <meta name="description" content="Shop top brands like Puma, Nike, Adidas, Levi's and more. Get clothing, footwear, electronics and accessories delivered to your door in 60 minutes across Cuttack and Bhubaneswar." />
    <meta name="keywords" content="fashion delivery Odisha, 60 minute delivery Cuttack, clothes delivery Bhubaneswar, Puma Nike Adidas online, ethnic wear delivery, sneakers Cuttack, fast fashion delivery India, Blinkiefash" />
    <meta name="author" content="Blinkiefash" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://blinkiefash.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blinkiefash" />
    <meta property="og:title" content="Blinkiefash — 60-Minute Fashion Delivery in Odisha" />
    <meta property="og:description" content="Shop top brands and get clothing, footwear & accessories delivered in 60 minutes across Cuttack and Bhubaneswar." />
    <meta property="og:url" content="https://blinkiefash.in/" />
    <meta property="og:image" content="https://res.cloudinary.com/dv6w0wyxk/image/upload/v1786438169/Image_1_idh5gu.jpg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blinkiefash — 60-Minute Fashion Delivery in Odisha" />
    <meta name="twitter:description" content="Shop top brands and get fashion delivered to your door in 60 minutes." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dv6w0wyxk/image/upload/v1786438169/Image_1_idh5gu.jpg" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Blinkiefash",
      "url": "https://blinkiefash.in",
      "logo": "https://res.cloudinary.com/dv6w0wyxk/image/upload/v1786438169/Image_1_idh5gu.jpg",
      "description": "60-minute fashion delivery service in Cuttack and Bhubaneswar, Odisha.",
      "sameAs": [],
      "areaServed": { "@type": "State", "name": "Odisha" },
      "serviceType": "Fashion Delivery"
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Blinkiefash",
      "url": "https://blinkiefash.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://blinkiefash.in/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
